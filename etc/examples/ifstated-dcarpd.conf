# $OpenBSD$
#
# Sample ifstated.conf for firewalls whose external address comes from
# DHCP and is shared with carp(4) and dcarpd(8).  It is the same on every
# firewall of the group.
#
# carp0 on em0 is the external interface.  The master gets the address by
# DHCP ("inet autoconf" in hostname.carp0).  dcarpd(8) gives the address to
# the backups and writes, on every firewall, its state file
# /var/db/dcarpd/carp0 with the gateway to use as master, from the
# provider, and the one to use as backup: the master's address on the
# internal network, its "dcarpd -g".  dcarpd sets no routes; this file
# does.
#
# This config does two things:
#  1. Monitor the gateway from the master and demote the carp interface
#     group to provoke a failover if it is not reachable, or em0 is down.
#  2. Follow carp0: as master route via the provider's gateway, as backup
#     via the master on the internal network.  Until dcarpd has written
#     its state file, the routes are left as they are.
#
# Run dcarpd(8) on every firewall with its own internal address, e.g.
#	rcctl set dcarpd flags -i carp0 -g 192.168.1.2
# and the same key in /etc/dcarp.key.

ext_carp_if = 'carp0'
ext_phys_if = 'em0'

# As backup the replies would go to the master, and without a gateway
# from dcarpd there is nothing to check: report success then.
gw_ok = '"ifconfig carp0 | grep -q \"carp: MASTER\" || exit 0; \
	[ -r /var/db/dcarpd/carp0 ] || exit 0; . /var/db/dcarpd/carp0; \
	[ -n \"$DCARP_GATEWAY\" ] || exit 0; \
	ping -q -c 1 -w 1 $DCARP_GATEWAY >/dev/null 2>&1" every 10'

# ifstated starts up with the first defined state
state neutral {
	if $ext_phys_if.link.down {
		run "logger -st ifstated 'interface to the gateway, em0, is down'"
		set-state demoted
	}
	if ! $gw_ok {
		run "logger -st ifstated 'could not reach the gateway'"
		set-state demoted
	}
}

state demoted {
	init {
		run "ifconfig -g carp carpdemote"
	}
	if $ext_phys_if.link.up && $gw_ok {
		run "logger -st ifstated 'the gateway is reachable again'"
		# remove our carp demotion
		run "ifconfig -g carp -carpdemote"
		set-state neutral
	}
}

# commands in the global scope are always run
if $ext_carp_if.link.up {
	run "logger -st ifstated 'carp0 is master'"
	# The provider's gateway from dcarpd's state file
	run "[ -r /var/db/dcarpd/carp0 ] && . /var/db/dcarpd/carp0 && \
	    [ -n \"$DCARP_GATEWAY\" ] && \
	    { route -q delete default; route -q add default $DCARP_GATEWAY; }"
}
if $ext_carp_if.link.down {
	run "logger -st ifstated 'carp0 is backup'"
	# The master on the internal network, from dcarpd's state file
	run "[ -r /var/db/dcarpd/carp0 ] && . /var/db/dcarpd/carp0 && \
	    [ -n \"$DCARP_BACKUP_GATEWAY\" ] && \
	    { route -q delete default; \
	    route -q add default $DCARP_BACKUP_GATEWAY; }"
}
